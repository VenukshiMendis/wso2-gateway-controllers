name: mcp-validation
version: v0.1.0
description: |
  Validates incoming MCP POST requests for protocol conformance and consistency before
  downstream policies are executed.

  For all MCP protocol versions, the policy validates the JSON-RPC request body, including
  JSON syntax, request structure, required member types, and ambiguous or duplicate members
  used for MCP request processing.

  For MCP 2026-07-28 and later, the policy additionally validates the MCP request headers.
  It verifies that required headers such as MCP-Protocol-Version, Mcp-Method, and Mcp-Name
  are present when applicable, contain valid HTTP field values, and are consistent with the
  corresponding protocol version, method, and capability identifier in the request body. A
  MCP-Protocol-Version that is not a dated revision is rejected as malformed.

  Requests that are malformed or contain inconsistent MCP header and body metadata are
  rejected with the appropriate protocol-level error response.

  On a gateway without the MCP operation resolver, only the request body is validated, since
  such a gateway accepts only MCP versions that mirror nothing into headers.

parameters:
  type: object
  additionalProperties: false
  properties: {}
systemParameters:
  type: object
  additionalProperties: false
  properties: {}
